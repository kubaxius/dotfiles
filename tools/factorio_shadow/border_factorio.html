<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        width: 128px;
        height: 128px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .frame {
        position: absolute;
        inset: 8px;
        border-radius: 0px;

        box-shadow:
          0 -2px 2px -1px #000000,
          -2px 0 2px -2px #0f0d0c,
          2px 0 2px -2px #0f0d0c,
          0 2px 2px -2px #ebe6e4;
      }
    </style>
  </head>
  <body>
    <!-- inset 0 0 3px 0 #000000, -->
    <div class="frame"></div>
  </body>
</html>
