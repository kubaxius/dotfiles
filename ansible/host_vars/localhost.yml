---
repo_dir: "{{ playbook_dir }}/.."
chezmoi_source_dir: "{{ repo_dir }}/chezmoi"

base_packages:
  - git
  - curl
  - zsh
  - chezmoi

shell_packages:
  - zsh # shell
  - fzf # fuzzy search
  - navi # snippet manager
  - tmux # terminal multiplexer
  - entr # allows running scripts on file change

# Package names are currently Arch Linux names, matching this workstation's
# Hyprland configuration.
hyprland_session_packages:
  - hyprland
  - hypridle
  - hyprpaper
  - waybar
  - uwsm # bridge for graphical user session and systemd
  - hyprpolkitagent # the popup you get while something asks for sudo
  - swaync # notification manager

# Canonical inventory of persistent Hyprland systemd user units. `origin`
# records who supplies a unit; `enabled` says whether this machine enables it.
# UWSM-created transient scopes remain documented in the Hyprland notes.
hyprland_user_services:
  - name: hyprpaper.service
    origin: package
    enabled: true
  - name: hypridle.service
    origin: package
    enabled: true
  - name: waybar.service
    origin: package
    enabled: true
  - name: swaync.service
    origin: package
    enabled: true
  - name: hyprpolkitagent.service
    origin: package
    enabled: true

hyprland_user_targets:
  - name: xdg-desktop-autostart.target
    masked: true
