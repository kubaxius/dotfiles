---
# Deimos is my main desktop PC.
repo_dir: "{{ playbook_dir }}/.."
chezmoi_source_dir: "{{ repo_dir }}/chezmoi"

base_packages:
  - git
  - curl
  - zsh
  - chezmoi

# Optional additions enabled on this machine.
workstation_features:
  - corsair
  - razer
  - media_apps
  - tablet_display

tablet_display:
  adb_serial: HPV50R5L
  output: HEADLESS-1
  moonlight:
    computer_name: Deimos
    computer_uuid: A70B0D20-CBE3-5022-2F0B-C1CDDC4E4025
    app_id: 881448767
    app_name: Desktop
    hdr: false
  mode: 1280x800@60
  position: 0x1440
  scale: 1
  render_device: /dev/dri/renderD128
  network_interface: enp17s0u5u4u1
  connection_name: tablet-android-usb
