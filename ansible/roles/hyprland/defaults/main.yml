---
# Packages required to start and maintain the Hyprland session.
hyprland_session_packages:
  - hyprland
  - hypridle
  - hyprpaper # wallpaper
  - waybar
  - uwsm # systemd bridge
  - hyprpolkitagent # graphical sudo
  - swaync # notifications
  - hyprshutdown

# Background services and desktop integration shared by every workstation.
hyprland_integration_packages:
  - pipewire # media server
  - pipewire-audio
  - pipewire-pulse
  - wireplumber
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - networkmanager
  - network-manager-applet
  - xsettingsd

# Command-line helpers used by the shared Hyprland and Waybar configuration.
hyprland_utility_packages:
  - jq # shell json support
  - wl-clipboard
  - cliphist
  - playerctl
  - hyprshot
  - satty
  - rofimoji
  - wtype
  - noto-fonts-emoji
  - otf-font-awesome
  - ttf-nerd-fonts-symbols

# Modules for the system Lua version used by Hyprland's Lua configuration.
# Keep these unversioned so they follow Arch's Lua ABI upgrades with Hyprland.
hyprland_lua_packages:
  - lua-dkjson
  - lua-penlight

# User-facing applications referenced by modules/programs.lua and Waybar.
hyprland_graphical_packages:
  - firefox
  - kitty
  - dolphin
  - rofi
  - obsidian
  - pavucontrol
  - kdeconnect
  - hyprpicker

# Build tools used by hyprpm when compiling plugins against the installed
# Hyprland version.
hyprland_plugin_build_packages:
  - cpio
  - cmake
  - gcc
  - git
  - meson

# Plugins are shared by every Hyprland workstation. `repository_name` is the
# name shown by `hyprpm list`, while `name` is the plugin to enable.
hyprland_plugins:
  - name: hyprexpo
    repository_name: hyprexpo
    repository: https://github.com/sandwichfarm/hyprexpo
  - name: imgborders
    repository_name: imgborders
    repository: https://codeberg.org/zacoons/imgborders

# The playbook maps the current host's `workstation_features` into this
# role-scoped input.
hyprland_workstation_features: []

hyprland_feature_packages:
  corsair:
    - ckb-next-git
  razer:
    - openrazer-daemon
  laptop:
    - brightnessctl
    - power-profiles-daemon
  media_apps:
    - flatpak

# Complete package set for the current workstation. Keep the category list in
# one place so adding another package category does not require task changes.
hyprland_workstation_packages: >-
  {{
    (
      hyprland_session_packages
      + hyprland_integration_packages
      + hyprland_utility_packages
      + hyprland_lua_packages
      + hyprland_graphical_packages
      + hyprland_plugin_build_packages
      + (hyprland_selected_feature_packages | default([]))
    ) | unique
  }}

hyprland_aur_builder_user: ansible_aur_builder
hyprland_paru_build_dir: >-
  /home/{{ hyprland_aur_builder_user }}/.cache/ansible/paru-bin

hyprland_system_services:
  - NetworkManager.service

hyprland_feature_system_services:
  corsair:
    - ckb-next-daemon.service
  razer: []
  laptop:
    - power-profiles-daemon.service
  media_apps: []

hyprland_feature_user_services:
  corsair:
    - ckb-next.service
  razer:
    - openrazer-daemon.service
  laptop: []
  media_apps: []

hyprland_feature_flatpaks:
  corsair: []
  razer:
    - name: xyz.z3ntu.razergenie
      method: system
  laptop: []
  media_apps:
    - name: com.mastermindzh.tidal-hifi
      method: user

# Persistent user units supplied by the session packages. UWSM-created
# transient scopes remain documented in the Hyprland notes.
hyprland_user_services:
  enable:
    - nm-applet.service
    - xsettingsd.service
    - hyprpaper.service
    - hypridle.service
    - waybar.service
    - swaync.service
    - hyprpolkitagent.service

# Keep XDG autostart available to other desktop environments, but disable its
# compositor-specific UWSM entry point for the Hyprland session.
hyprland_user_targets:
  unmask:
    - xdg-desktop-autostart.target
  mask:
    - wayland-session-xdg-autostart@hyprland.desktop.target
  enable:
    - clipboard.target
