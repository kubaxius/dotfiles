---
- name: Configure Flathub for selected installation scopes
  become: "{{ item == 'system' }}"
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: "{{ item }}"
    state: present
  loop: >-
    {{
      hyprland_selected_feature_flatpaks
      | map(attribute="method")
      | unique
      | list
    }}
  loop_control:
    label: "{{ item }}"
  tags:
    - hyprland-flatpaks
    - hyprland-media-apps

- name: Install selected applications from Flathub
  become: "{{ item.method == 'system' }}"
  community.general.flatpak:
    name: "{{ item.name }}"
    method: "{{ item.method }}"
    remote: flathub
    state: present
  loop: "{{ hyprland_selected_feature_flatpaks }}"
  loop_control:
    label: "{{ item.name }} ({{ item.method }})"
  tags:
    - hyprland-flatpaks
    - hyprland-media-apps
