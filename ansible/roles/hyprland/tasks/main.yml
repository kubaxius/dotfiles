---
- name: Verify that the Hyprland role is running on Arch Linux
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Archlinux"
    fail_msg: The hyprland role currently supports Arch Linux only.

- name: Resolve the workstation feature set
  ansible.builtin.import_tasks: features.yml

- name: Configure AUR support and install workstation packages
  ansible.builtin.import_tasks: aur.yml

- name: Configure Hyprland plugins
  ansible.builtin.import_tasks: plugins.yml

- name: Configure Flathub applications
  ansible.builtin.import_tasks: flathub.yml
