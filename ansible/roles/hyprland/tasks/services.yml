---
- name: Enable required workstation system services
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: >-
    {{
      (hyprland_system_services + hyprland_selected_feature_services)
      | unique
    }}

- name: Enable Hyprland user services
  become: false
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    scope: user
  loop: >-
    {{
      (hyprland_user_services.enable + hyprland_selected_feature_user_services)
      | unique
    }}
  loop_control:
    label: "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  tags:
    - hyprland-user-services

- name: Unmask shared user targets
  become: false
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
    scope: user
  loop: "{{ hyprland_user_targets.unmask }}"
  loop_control:
    label: "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  tags:
    - hyprland-user-services

- name: Mask Hyprland user targets
  become: false
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
    scope: user
  loop: "{{ hyprland_user_targets.mask }}"
  loop_control:
    label: "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  tags:
    - hyprland-user-services

- name: Enable Hyprland user targets
  become: false
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    scope: user
  loop: "{{ hyprland_user_targets.enable }}"
  loop_control:
    label: "{{ item }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
  tags:
    - hyprland-user-services
