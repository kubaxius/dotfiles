---
- name: Validate requested workstation features against supported features
  ansible.builtin.assert:
    that:
      - >-
        hyprland_workstation_features
        | difference(hyprland_feature_packages.keys() | list)
        | length == 0
    fail_msg: >-
      Unknown workstation feature(s):
      {{
        hyprland_workstation_features
        | difference(hyprland_feature_packages.keys() | list)
        | join(', ')
      }}.
      Supported features:
      {{ hyprland_feature_packages.keys() | sort | join(', ') }}.
  tags:
    - hyprland-feature-resolution
    - hyprland-user-services
    - hyprland-flatpaks
    - hyprland-media-apps

- name: Initialize selected feature packages and services
  ansible.builtin.set_fact:
    hyprland_selected_feature_packages: []
    hyprland_selected_feature_services: []
    hyprland_selected_feature_user_services: []
    hyprland_selected_feature_flatpaks: []
  tags:
    - hyprland-feature-resolution
    - hyprland-user-services
    - hyprland-flatpaks
    - hyprland-media-apps

- name: Resolve selected workstation features
  ansible.builtin.set_fact:
    hyprland_selected_feature_packages: >-
      {{ hyprland_selected_feature_packages + hyprland_feature_packages[item] }}
    hyprland_selected_feature_services: >-
      {{
        hyprland_selected_feature_services
        + hyprland_feature_system_services[item]
      }}
    hyprland_selected_feature_user_services: >-
      {{
        hyprland_selected_feature_user_services
        + hyprland_feature_user_services[item]
      }}
    hyprland_selected_feature_flatpaks: >-
      {{
        hyprland_selected_feature_flatpaks
        + hyprland_feature_flatpaks[item]
      }}
  loop: "{{ hyprland_workstation_features }}"
  tags:
    - hyprland-feature-resolution
    - hyprland-user-services
    - hyprland-flatpaks
    - hyprland-media-apps

- name: Report resolved workstation profile
  ansible.builtin.debug:
    msg:
      features: "{{ hyprland_workstation_features }}"
      packages: >-
        {{
          (
            hyprland_session_packages
            + hyprland_integration_packages
            + hyprland_utility_packages
            + hyprland_graphical_packages
            + hyprland_selected_feature_packages
          ) | unique
        }}
      system_services: >-
        {{
          (hyprland_system_services + hyprland_selected_feature_services)
          | unique
        }}
      user_services: >-
        {{
          (
            hyprland_user_services.enable
            + hyprland_selected_feature_user_services
          ) | unique
        }}
      flatpaks: "{{ hyprland_selected_feature_flatpaks }}"
    verbosity: 1
  tags:
    - hyprland-feature-resolution
