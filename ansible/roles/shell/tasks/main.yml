---
- name: Install important shell tools and zsh
  become: true
  community.general.pacman:
    name: "{{ shell_packages }}"
    state: present
  when: ansible_facts.os_family == "Archlinux"

- name: Create the tmux plugin directory
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.tmux/plugins"
    state: directory
    mode: "0755"

- name: Install tmux plugin manager (Tpack)
  become: false
  ansible.builtin.git:
    repo: https://github.com/tmuxpack/tpack.git
    dest: "{{ ansible_facts.env.HOME }}/.tmux/plugins/tpm"
    version: main
    update: true
