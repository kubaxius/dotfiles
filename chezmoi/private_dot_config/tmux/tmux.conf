unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s

set -g mouse on

set-option -g status-position top

# Keep runtime plugins out of the XDG configuration directory. Automatic
# plugin updates stay disabled; updates are only run explicitly from Tpack.
set -g @tpack-plugin-path "$HOME/.local/share/tmux/plugins"
set -g @tpack-update-mode "off"

# List of plugins
set -g @plugin "tmux-plugins/tmux-sensible alias=tmux-sensible"
set -g @plugin "catppuccin/tmux alias=catppuccin-tmux"
set -g @tmux-which-key-xdg-enable 1
set -g @tmux-which-key-xdg-plugin-path "tmux/tmux-which-key"
set -g @plugin "alexwforsythe/tmux-which-key alias=tmux-which-key-runtime"
set -g @plugin "b0o/tmux-autoreload alias=tmux-autoreload"
set -g @plugin "sainnhe/tmux-fzf alias=tmux-fzf"

# Initialize tpack (keep this line at the very bottom of tmux.conf)
run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"
