# Tmux sessions persist independently of their Kitty client.  Closing a Kitty
# window should therefore detach from tmux without a redundant confirmation.
confirm_os_window_close 0

# Remapping so that opencode behaves.
# remap as ctrl+W
map ctrl+backspace send_text all \x17
#+ remap as ctrl+J
map shift+enter send_text all \x0a